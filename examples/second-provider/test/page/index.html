<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that talks to a person's agent</title>
  </head>
  <body>
    <p id="provider">Looking for a provider.</p>
    <button type="button" id="ask">Choose an agent</button>
    <button type="button" id="list">List my agents</button>
    <button type="button" id="turn">Start a conversation</button>
    <button type="button" id="again">Say something else</button>
    <button type="button" id="resume">Carry on from last time</button>
    <button type="button" id="leave">Let go of the agent</button>
    <ul id="agents"></ul>
    <pre id="said"></pre>
    <pre id="log"></pre>
    <script src="page.js"></script>
  </body>
</html>
