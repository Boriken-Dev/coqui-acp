[package]
name = "coqui-acp"
description = "Drive any Agent Client Protocol agent: the connect, resume and turn state machine, permission deciding and line transports above the protocol's own SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "client", "json-rpc"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The secret-prompt extension (`coqui_acp::secret`): a value the person types or is shown travels sealed to a key only its receiver holds.
secret = [
    "dep:base64", "dep:data-encoding", "dep:hkdf", "dep:hmac", "dep:hpke", "dep:p256", "dep:sha2", "dep:subtle",
    "dep:x25519-dalek", "dep:zeroize",
]

[dependencies]
agent-client-protocol.workspace = true
futures.workspace = true
# A form's questions keep the agent's order.
serde_json = { workspace = true, features = ["preserve_order"] }
base64 = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hpke = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
