[package]
name = "coqui-acp-harness"
description = "Serve a coding agent's own command line as an Agent Client Protocol agent: process trees, bounded lines, neutral events, and ACP v1 and v2 shapes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "harness", "stdio"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `antigravity`: the quota Antigravity (`agy`) reports on its own loopback port, as usage buckets.
antigravity = ["dep:serde", "dep:time", "dep:ureq"]
# The acp_harness kind's spawner on this machine, and Spawn through any host's spawner.
kind = []

[dependencies]
coqui-acp-api = { path = "../coqui-acp-api" }
base64.workspace = true
serde = { workspace = true, optional = true }
time = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
coqui-acp = { path = "../coqui-acp" }
# The suite that holds a spawner's file methods to their rules.
coqui-acp-api = { path = "../coqui-acp-api", features = ["contract"] }
# A self-signed certificate made at test time, for the stand-in that answers over TLS.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { workspace = true, features = ["formatting"] }

[[example]]
name = "spawner_host"
required-features = ["kind"]

[[test]]
name = "spawner"
required-features = ["kind"]

[[test]]
name = "antigravity"
required-features = ["antigravity"]

[lints]
workspace = true
