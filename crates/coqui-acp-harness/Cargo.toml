[package]
name = "coqui-acp-harness"
description = "Serve a coding agent's own command line as an Agent Client Protocol agent: process trees, bounded lines, neutral events, and ACP v1 and v2 shapes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "harness", "stdio"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `antigravity`: Antigravity's (`agy`) account and quota, from its stored login and Google's service or from its own loopback
# port, as usage buckets.
antigravity = [
    "dep:serde",
    "dep:time",
    "dep:ureq",
    "dep:windows-sys",
    "dep:memchr",
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
# The acp_harness kind's spawner on this machine, and Spawn through any host's spawner.
kind = ["dep:guatiao-serde", "dep:coqui-acp-history"]

[dependencies]
coqui-acp-api = { path = "../coqui-acp-api" }
base64.workspace = true
serde = { workspace = true, optional = true }
time = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
guatiao-serde = { workspace = true, optional = true }
coqui-acp-history = { path = "../coqui-acp-history", optional = true }
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
# Antigravity's OAuth client among its program's strings.
memchr = { version = "2", optional = true }
# Antigravity's login in the operating system's keyring, through keyring-core and the platform's store below.
keyring-core = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The Secret Service.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", optional = true, features = ["crypto-rust"] }

# The Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", optional = true, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
# The TCP table, for the Antigravity quota reader; its one `unsafe` module.
windows-sys = { version = "0.61.2", optional = true, default-features = false, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
# Windows' Credential Manager, for Antigravity's login.
windows-native-keyring-store = { version = "1", optional = true, default-features = false }

[dev-dependencies]
coqui-acp = { path = "../coqui-acp" }
# The suite that holds a spawner's file methods to their rules.
coqui-acp-api = { path = "../coqui-acp-api", features = ["contract"] }
guatiao = { workspace = true, features = ["provider", "load"] }
guatiao-serde = { workspace = true, features = ["json"] }
# A self-signed certificate made at test time, for the stand-in that answers over TLS.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { workspace = true, features = ["formatting"] }

[[example]]
name = "spawner_host"
required-features = ["kind"]

# The program the stdio provider's tests start in place of Grok and Antigravity.
[[example]]
name = "fake_stdio_cli"
required-features = ["kind"]

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "stdio_provider"
crate-type = ["cdylib"]
required-features = ["kind"]

[[test]]
name = "spawner"
required-features = ["kind"]

[[test]]
name = "account"
required-features = ["kind"]

[[test]]
name = "opencode"
required-features = ["kind"]

[[test]]
name = "stdio"
required-features = ["kind"]

[[test]]
name = "replay"
required-features = ["kind"]

[[test]]
name = "antigravity"
required-features = ["antigravity"]

[[test]]
name = "agy_login"
required-features = ["antigravity"]

[lints]
workspace = true
