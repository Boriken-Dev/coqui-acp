[package]
name = "coqui-acp-harness"
description = "Serve a coding agent's own command line as an Agent Client Protocol agent: process trees, bounded lines, neutral events, and ACP v1 and v2 shapes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "harness", "stdio"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The acp_harness kind's spawner on this machine, and Spawn through any host's spawner.
kind = ["dep:coqui-acp-harness-kind"]

[dependencies]
coqui-acp-harness-kind = { path = "../coqui-acp-harness-kind", optional = true }
base64.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
coqui-acp = { path = "../coqui-acp" }

[[example]]
name = "spawner_host"
required-features = ["kind"]

[[test]]
name = "spawner"
required-features = ["kind"]

[lints]
workspace = true
