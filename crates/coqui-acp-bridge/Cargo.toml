[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming", "command-line-utilities"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[[bin]]
name = "coqui-acp-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "f45938e8cede85a2a2e00afedea1b4944f7c8a67" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# Unpublished so far.
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681", features = ["pin"] }
coqui-peer-tls = { version = "=0.0.0-alpha.1", features = ["generate", "ca"] }
coqui-net-acl = { version = "=0.0.0-alpha.0" }
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false }
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "df5be67b3a18e23b2d0073eb0f795a49a4221c93", features = ["websocket", "webtransport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
url = "2.5"

# Ends an agent's process group, and sees an agent end without collecting it, through safe calls rather than a `kill` found on PATH.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# A job object per agent, which the system ends with everything in it when the bridge's handle closes, however the bridge ends.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
