[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming", "command-line-utilities"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[[bin]]
name = "coqui-acp-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "f6da790585e51345fa58f5e989cedd6500a0b962" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
# Unpublished so far.
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", features = ["pin"] }
coqui-peer-tls = { version = "=0.0.0-alpha.1", features = ["generate", "ca"] }
coqui-net-acl = { version = "=0.0.0-alpha.0" }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca", features = ["websocket", "webtransport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
url = "2.5"

# Ends an agent's process group, and sees an agent end without collecting it, through safe calls rather than a `kill` found on PATH.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# A job object per agent, which the system ends with everything in it when the bridge's handle closes, however the bridge ends.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
