[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# The proof, pairing, streams, peers and forwarding (`sealed`, `forward`), and what an agent adds around them: the home, discovery and MCP offers.
cabuya = { git = "https://github.com/Boriken-Dev/cabuya", rev = "5fb2a34cb2b3fb5b289b6958c145a5f124ff5879", features = ["sealed", "forward"] }
agentic-peer = { git = "https://github.com/Boriken-Dev/agentic-peer", rev = "19414c27507dfd35d10552159463b5b7cea11c39" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f" }
# Unpublished so far.
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "d5e8cc4792f7d6e69921822da59ee6e10324cb9a", features = ["pin"] }
coqui-peer-tls = { version = "=0.0.0-alpha.1", features = ["generate", "ca"] }
coqui-net-acl = { version = "=0.0.0-alpha.0" }
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false }
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "51ec0f127dbba5100ea709d36724e49c4829c351", features = ["websocket", "webtransport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
url = "2.5"

# Ends an agent's process group, and sees an agent end without collecting it, through safe calls rather than a `kill` found on PATH.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# A job object per agent, which the system ends with everything in it when the bridge's handle closes, however the bridge ends.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
