[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming", "command-line-utilities"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[[bin]]
name = "coqui-acp-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
# Unpublished so far.
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", features = ["pin"] }
coqui-peer-tls = { version = "=0.0.0-alpha.1", features = ["generate"] }
coqui-net-acl = { version = "=0.0.0-alpha.0" }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "4dc609e5c5f23ccbda993e3e126b8d13938648a6", features = ["websocket", "webtransport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5"

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
