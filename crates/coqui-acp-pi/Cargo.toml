[package]
name = "coqui-acp-pi"
description = "Pi as an Agent Client Protocol agent, in Rust: a driver for its RPC mode and an ACP agent on it, with no Node of its own and no adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "pi", "rpc"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Export and import of the harness's own session files in the standard history format.
history = ["dep:coqui-acp-history"]

[dependencies]
clap.workspace = true
coqui-acp-api = { path = "../coqui-acp-api" }
coqui-acp-harness = { path = "../coqui-acp-harness", features = ["kind"] }
coqui-acp-history = { path = "../coqui-acp-history", optional = true }
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
coqui-acp = { path = "../coqui-acp" }
# A history that came from another harness, to move a session between them.
coqui-acp-claude = { path = "../coqui-acp-claude", features = ["history"] }
coqui-acp-history = { path = "../coqui-acp-history" }
# The contract suite, which holds the provider to the kind.
coqui-acp-api = { path = "../coqui-acp-api", features = ["contract"] }
guatiao = { workspace = true, features = ["provider", "load"] }
guatiao-serde = { workspace = true, features = ["json"] }

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "pi_provider"
crate-type = ["cdylib"]

[lints]
workspace = true
