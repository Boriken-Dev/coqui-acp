[package]
name = "coqui-acp-secrets"
description = "The host side of secret prompts for an Agent Client Protocol agent: a handle store, the MCP tools that request, use and show a secret, the person's approval of every use, and output scrubbing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "secrets", "mcp"]
categories = ["authentication", "development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
base64.workspace = true
coqui-acp = { path = "../coqui-acp", features = ["secret"] }
data-encoding.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
