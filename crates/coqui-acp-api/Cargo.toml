[package]
name = "coqui-acp-api"
description = "coqui-acp's Guatiao kinds: acp_harness, an Agent Client Protocol agent driver written in any language Guatiao hosts and started over a channel of ACP messages, and the spawner its programs start through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "harness", "guatiao", "plugin"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "__pycache__"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The suite every provider of the kind is held to, as a module and as `acp-harness-check`, which runs it
# on a library file or a source file in any language.
contract = ["dep:serde_json", "dep:guatiao-serde", "dep:coqui-acp", "guatiao/load"]

[dependencies]
guatiao = { workspace = true, features = ["provider"] }
guatiao-channel.workspace = true
serde.workspace = true
coqui-acp = { path = "../coqui-acp", optional = true }
serde_json = { workspace = true, optional = true }
guatiao-serde = { workspace = true, optional = true }

[dev-dependencies]
guatiao = { workspace = true, features = ["provider", "load"] }
guatiao-serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[[bin]]
name = "acp-harness-check"
required-features = ["contract"]

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "echo_harness"
crate-type = ["cdylib"]

[[test]]
name = "echo"
required-features = ["contract"]

[[test]]
name = "check"
required-features = ["contract"]

[lints]
workspace = true
