[package]
name = "coqui-acp-api"
description = "coqui-acp's Guatiao kinds: acp_harness, an Agent Client Protocol agent driver written in any language Guatiao hosts and started over a channel of ACP messages, and the spawner its programs start through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "harness", "guatiao", "plugin"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "__pycache__"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The suite every provider of the kind is held to, as a module and as `acp-harness-check`, which runs it
# on a library file or a source file in any language.
# The readers an account's usage is read with: one bounded read of a JSON document, and RFC 3339 times.
reader = ["dep:serde_json", "dep:ureq"]
contract = ["dep:serde_json", "dep:guatiao-serde", "dep:coqui-acp", "dep:rustix", "dep:win32job", "guatiao/load"]

[dependencies]
guatiao = { workspace = true, features = ["provider"] }
guatiao-channel.workspace = true
serde.workspace = true
coqui-acp = { path = "../coqui-acp", optional = true }
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
guatiao-serde = { workspace = true, optional = true }

# The programs the contract suite starts end with their whole tree.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true, optional = true }

[dev-dependencies]
guatiao = { workspace = true, features = ["provider", "load"] }
guatiao-serde.workspace = true
# The committed descriptions are written in the order the kinds declare their fields.
serde_json = { workspace = true, features = ["preserve_order"] }
uuid.workspace = true

[[bin]]
name = "acp-harness-check"
required-features = ["contract"]

[[bin]]
name = "acp-account-check"
required-features = ["contract"]

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "echo_harness"
crate-type = ["cdylib"]

# The echo account provider's library, which the tests load.
[[example]]
name = "echo_account_provider"
crate-type = ["cdylib"]

[[test]]
name = "echo"
required-features = ["contract"]

[[test]]
name = "check"
required-features = ["contract"]

[[test]]
name = "account_provider"
required-features = ["contract"]

[lints]
workspace = true
