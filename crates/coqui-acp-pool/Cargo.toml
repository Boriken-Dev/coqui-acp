[package]
name = "coqui-acp-pool"
description = "The policy that picks which agent, account and model serves a session or task from a pool, and moves a running session on when its usage runs out: pure, with no I/O, secrets or clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "pool", "usage", "scheduling"]
categories = ["algorithms", "development-tools"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# `SharedMemory` and `SharedCache`: the round-robin cursor and a time-to-live map behind a mutex.
std = []

[dependencies]
coqui-acp-api = { path = "../coqui-acp-api" }
coqui-acp-history = { path = "../coqui-acp-history" }
serde_json.workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
