[package]
name = "coqui-acp-codex"
description = "Codex as an Agent Client Protocol agent, in Rust: a driver for its app-server protocol and an ACP agent on it, with no Node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "codex", "app-server"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Export and import of the harness's own session files in the standard history format.
history = ["dep:coqui-acp-history"]

[[bin]]
name = "coqui-acp-codex"
path = "src/main.rs"

[dependencies]
clap.workspace = true
coqui-acp-api = { path = "../coqui-acp-api" }
coqui-acp-harness = { path = "../coqui-acp-harness", features = ["kind"] }
serde_json.workspace = true
coqui-acp-history = { path = "../coqui-acp-history", optional = true }

[dev-dependencies]
coqui-acp = { path = "../coqui-acp" }
# The tests move a session between the two harnesses.
coqui-acp-claude = { path = "../coqui-acp-claude", features = ["history"] }
coqui-acp-history = { path = "../coqui-acp-history" }
# The contract suite and `acp-harness-check`, which hold the provider to the kind.
coqui-acp-api = { path = "../coqui-acp-api", features = ["contract"] }
guatiao = { workspace = true, features = ["provider", "load"] }
guatiao-serde = { workspace = true, features = ["json"] }
uuid.workspace = true

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "codex_provider"
crate-type = ["cdylib"]

[lints]
workspace = true
