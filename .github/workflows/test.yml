name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, deleted after its run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The JavaScript peer of the bridge's test, at the revision crates/coqui-acp-bridge/Cargo.toml pins.
      - uses: actions/checkout@v4
        with:
          repository: Boriken-Dev/coqui-peer-webcrypto
          ref: 95d415837effd8bfd7fbc32dc03fa9052670ca1e
          path: peer-webcrypto
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          COQUI_ACP_TEST_WEBCRYPTO: ${{ github.workspace }}/peer-webcrypto/bindings/js/coqui-peer-webcrypto/src/index.mjs
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart/coqui_acp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
