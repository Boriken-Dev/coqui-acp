name: coqui_acp
description: A client for the Agent Client Protocol, version 1 and version 2, over any stream of JSON-RPC messages.
version: 0.0.0-alpha.0
repository: https://github.com/Boriken-Dev/coqui-acp
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  # The secret-prompt extension's sealing: X25519, AES-GCM, HKDF and HMAC (HPKE, RFC 9180, is composed from them).
  cryptography: ^2.9.0
  # Its key bindings: ECDSA over P-256, which `cryptography` has no pure-Dart implementation of.
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
