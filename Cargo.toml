[workspace]
resolver = "3"
members = ["crates/coqui-acp", "crates/coqui-acp-bridge", "crates/coqui-acp-page"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"

[workspace.dependencies]
# The protocol's own SDK, Apache-2.0, runtime-agnostic: this workspace adds the session logic above it.
agent-client-protocol = { version = "3.6", default-features = false }
# Its executor and channels: the SDK runs on `futures`, so no Tokio is forced on a consumer.
futures = "0.3"
serde_json = "1"


[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

# coqui-peer-tls names the released coqui-peer, and one PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
