[workspace]
resolver = "3"
members = [
    "crates/coqui-acp",
    "crates/coqui-acp-bridge",
    "crates/coqui-acp-claude",
    "crates/coqui-acp-codex",
    "crates/coqui-acp-harness",
    "crates/coqui-acp-api",
    "crates/coqui-acp-history",
    "crates/coqui-acp-page",
    "crates/coqui-acp-provider",
    "examples/provider-python",
]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"

[workspace.dependencies]
# The protocol's own SDK, Apache-2.0, runtime-agnostic: this workspace adds the session logic above it.
agent-client-protocol = { version = "3.6", default-features = false }
# Its executor and channels: the SDK runs on `futures`, so no Tokio is forced on a consumer.
futures = "0.3"
# The provider kind and what crosses it. Alpha, by revision: every project building against the kind needs the same
# one, and nothing else carries a kind across languages.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e" }
# The channel an ACP harness is started over: Guatiao's own object kinds, at the same revision.
guatiao-channel = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e" }
# A launch's opaque JSON as a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", default-features = false }
# The event types' JSON shape.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
# Diagnostics from a library: events with fields, for whoever installs a subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Session and tool call identifiers no client can guess.
uuid = { version = "1", default-features = false, features = ["v4"] }
# A harness's terminal output as ACP version 2 carries it.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# The command lines of the harness agents.
clap = { version = "4", features = ["derive", "env"] }
# A harness's process group, ended by a system call.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# A harness and everything it starts in one job object, ended together.
win32job = "2.0.3"
# The history format's body digest.
sha2 = { version = "0.11", default-features = false }
# Lower-case hexadecimal for digests.
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
# The patterns a redaction removes: linear-time matching, so a pattern a caller supplies cannot hang a reader.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }


# The secret-prompt extension's sealing: RFC 9180 HPKE, base mode, DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-128-GCM.
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
# The extension's key bindings: ECDSA over P-256 and SHA-256, the signature of the webcrypto peer method, and PKCS#8 for its keys.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
# The extension's Diffie-Hellman proof for a peer identity that cannot sign (the noise method's X25519 static key), at hpke's version.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
# The proof's key derivation (HKDF, RFC 5869, is two HMACs here) and tag; its state is zeroed when dropped.
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
# Secrets that are zeroed when dropped.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# `antigravity`: the one RFC 3339 reader this workspace uses.
time = { version = "0.3", default-features = false, features = ["parsing"] }
# `antigravity`: a blocking HTTP client for the agent's own loopback port, TLS by rustls with ring and a verifier it can switch off for
# a literal loopback address only.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

# coqui-peer-tls names the released coqui-peer, and one PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# The published coqui-peer-tls still names coqui-peer's old field; this commit follows it.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d" }
